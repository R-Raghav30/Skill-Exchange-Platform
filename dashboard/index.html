<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .hero {
    background: var(--gradient-primary);
    border-radius: var(--r-lg);
    padding: 32px;
    color: #fff;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::after {
    content: '';
    position: absolute; width: 220px; height: 220px; border-radius: 50%;
    background: rgba(255,255,255,.12); top: -80px; right: -40px;
  }
  .hero h1 { color: #fff; font-size: 26px; }
  .hero p { color: rgba(255,255,255,.85); margin-top: 6px; }
  .stat-card { display: flex; align-items: center; gap: 14px; }
  .stat-card__icon {
    width: 46px; height: 46px; border-radius: var(--r-md);
    display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink:0;
  }
  .stat-card__value { font-family: var(--font-display); font-weight: 800; font-size: 24px; }
  .stat-card__label { font-size: 13px; color: var(--ink-soft); }
  .skill-row { display:flex; align-items:center; justify-content:space-between; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .skill-row:last-child { border-bottom: none; }
  .two-col { display: grid; grid-template-columns: 1.4fr 1fr; gap: 20px; }
  @media (max-width: 900px) { .two-col { grid-template-columns: 1fr; } .hero { flex-direction:column; align-items:flex-start; } }
  .activity-item { display:flex; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--border); }
  .activity-item:last-child { border-bottom: none; }
  .activity-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--violet); margin-top: 6px; flex-shrink:0; }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container">

    <div class="hero">
      <div>
        <span class="pill" style="background:rgba(255,255,255,.2);color:#fff;">Welcome back</span>
        <h1 id="greetName" style="margin-top:10px;">Loading…</h1>
        <p>Here's what's happening with your swaps today.</p>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;">
        <a href="../search-skills/index.html" class="btn btn-block" style="background:#fff;color:var(--violet);white-space:nowrap;">Find a skill →</a>
        <a href="../rate-session/index.html" class="btn btn-block" style="background:rgba(255,255,255,.2);color:#fff;border:1.5px solid rgba(255,255,255,.4);white-space:nowrap;">★ Rate sessions</a>
      </div>
    </div>

    <div class="grid grid-3" id="statCards" style="margin-bottom:24px;"></div>

    <div class="two-col">
      <div class="card">
        <h3 class="section-title">Suggested skills for you</h3>
        <p class="section-sub">Top mentors based on your requested skills</p>
        <div id="suggested"></div>
      </div>

      <div class="card">
        <h3 class="section-title">Recent activity</h3>
        <p class="section-sub">Latest exchange requests</p>
        <div id="activity"></div>
        <a href="../exchange-requests/index.html" class="btn btn-secondary btn-block" style="margin-top:14px;">View all requests</a>
      </div>
    </div>

  </div>
</main>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  if (user) {
    renderNavbar('/dashboard/index.html');
    document.getElementById('greetName').textContent = 'Hey ' + user.name.split(' ')[0] + ' 👋';

    (async () => {
      const stats = await db.getStats(user.id);
      const statsData = [
        { icon:'📨', bg:'#f1ebff', color:'var(--violet)', value: stats.activeRequests, label: 'Active Requests' },
        { icon:'📅', bg:'#e8f0fe', color:'var(--royal-blue)', value: stats.upcomingSessions, label: 'Upcoming Sessions' },
        { icon:'✅', bg:'#e6f6f0', color:'var(--emerald-dark)', value: stats.completedSessions, label: 'Completed Sessions' }
      ];
      document.getElementById('statCards').innerHTML = statsData.map(s => `
        <div class="card stat-card hover-lift">
          <div class="stat-card__icon" style="background:${s.bg};color:${s.color};">${s.icon}</div>
          <div>
            <div class="stat-card__value">${s.value}</div>
            <div class="stat-card__label">${s.label}</div>
          </div>
        </div>`).join('');

      const mySkills = await db.getMySkills(user.id);
      const myRequests = mySkills.filter(s => s.type === 'request').map(s => s.name);
      let suggestions = [];
      for (const name of myRequests) {
        const found = await db.searchSkills({ query: name, type: 'offer' });
        suggestions.push(...found.filter(f => f.userId !== user.id));
      }
      if (!suggestions.length) suggestions = (await db.searchSkills({ type: 'offer' })).filter(f => f.userId !== user.id).slice(0, 3);
      const seen = new Set();
      suggestions = suggestions.filter(s => !seen.has(s.userId) && seen.add(s.userId)).slice(0, 4);

      document.getElementById('suggested').innerHTML = suggestions.length ? suggestions.map(s => `
        <div class="skill-row">
          <div style="display:flex;align-items:center;gap:10px;">
            <div class="avatar" style="width:34px;height:34px;font-size:12px;">${s.user.name.split(' ').map(p=>p[0]).join('').slice(0,2)}</div>
            <div>
              <div style="font-weight:600;font-size:14.5px;">${s.name}</div>
              <div style="font-size:12.5px;color:var(--ink-soft);">${s.user.name} · ★ ${s.user.mentorScore || 'New'}</div>
            </div>
          </div>
          <a href="../search-skills/index.html" class="btn btn-secondary btn-sm">View</a>
        </div>`).join('') : `<div class="empty-state"><div class="empty-state__icon">🌱</div><p>Add a skill you want to learn to get suggestions.</p></div>`;

      const { incoming } = await db.getRequestsFor(user.id);
      document.getElementById('activity').innerHTML = incoming.length ? incoming.slice(0,4).map(r => `
        <div class="activity-item">
          <div class="activity-dot"></div>
          <div>
            <div style="font-size:14px;"><b>${r.fromUser?.name || 'Someone'}</b> requested <b>${r.skillName}</b></div>
            <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">${new Date(r.createdAt).toLocaleDateString()} · <span class="pill ${r.status==='pending'?'pill-violet':r.status==='accepted'?'pill-emerald':'pill-grey'}" style="padding:2px 8px;">${r.status}</span></div>
          </div>
        </div>`).join('') : `<div class="empty-state"><div class="empty-state__icon">📭</div><p>No requests yet.</p></div>`;
    })();
  }
</script>
</body>
</html>
