<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Community · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .group-card { display:flex; flex-direction:column; gap:12px; }
  .group-top { display:flex; align-items:center; gap:12px; }
  .group-icon { width:46px;height:46px;border-radius:var(--r-md); display:flex;align-items:center;justify-content:center; font-size:20px; }
  .member-stack { display:flex; }
  .member-stack .avatar { width:26px;height:26px;font-size:10px;border:2px solid #fff; margin-left:-8px; }
  .member-stack .avatar:first-child { margin-left:0; }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container">
    <span class="eyebrow">Connect</span>
    <h1 class="section-title" style="font-size:26px;margin-top:6px;">Community Groups</h1>
    <p class="section-sub">Forums and group chats organized by department and interest.</p>

    <div class="grid grid-3" id="groups"></div>
  </div>
</main>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  if (user) renderNavbar('/community-groups/index.html');

  const groups = [
    { name: 'Computer Science Hub', icon:'💻', bg:'#e8f0fe', color:'var(--royal-blue)', members: 342, desc: 'DSA doubts, project collabs, and internship tips.' },
    { name: 'Design & Art Circle', icon:'🎨', bg:'#f1ebff', color:'var(--violet)', members: 198, desc: 'Portfolio feedback, Figma tricks, and sketch swaps.' },
    { name: 'Music Makers', icon:'🎸', bg:'#e6f6f0', color:'var(--emerald-dark)', members: 121, desc: 'Jam sessions, theory help, and instrument trades.' },
    { name: 'Electronics & Robotics', icon:'🔌', bg:'#fff4e0', color:'#c07a00', members: 156, desc: 'Circuit reviews and robotics competition prep.' },
    { name: 'Public Speaking Club', icon:'🎤', bg:'#fdecec', color:'#c0392b', members: 89, desc: 'Practice pitches and get honest feedback.' },
    { name: 'First-Years Corner', icon:'🌱', bg:'#e6f6f0', color:'var(--emerald-dark)', members: 267, desc: 'New to campus? Find your first skill swap here.' }
  ];

  document.getElementById('groups').innerHTML = groups.map(g => `
    <div class="card group-card hover-lift">
      <div class="group-top">
        <div class="group-icon" style="background:${g.bg};color:${g.color};">${g.icon}</div>
        <div>
          <div style="font-weight:700;font-size:15px;">${g.name}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);">${g.members} members</div>
        </div>
      </div>
      <p style="font-size:13.5px;color:var(--ink-soft);">${g.desc}</p>
      <button class="btn btn-secondary btn-sm" style="align-self:flex-start;" onclick="toast('Joined ${g.name.replace(/'/g,"")}!','success')">Join group</button>
    </div>`).join('');
</script>
</body>
</html>
