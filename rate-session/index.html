<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rate Session · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .session-item { display:flex; justify-content:space-between; align-items:center; padding: 16px 0; border-bottom: 1px solid var(--border); }
  .session-item:last-child { border-bottom: none; }
  .rate-panel { text-align: center; padding: 8px 0 4px; }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container" style="max-width: 640px;">
    <span class="eyebrow">Feedback</span>
    <h1 class="section-title" style="font-size:26px;margin-top:6px;">Rate your sessions</h1>
    <p class="section-sub">Your rating helps mentors build their SkillSwap reputation.</p>

    <div class="card">
      <div id="list"></div>
    </div>
  </div>
</main>

<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(26,26,46,.5);z-index:100;align-items:center;justify-content:center;padding:20px;">
  <div class="card" style="max-width:420px;width:100%;">
    <h3 class="section-title" id="modalTitle">Rate session</h3>
    <p class="section-sub" id="modalSub"></p>
    <div class="rate-panel">
      <div class="stars" id="starRow">
        <span class="star" data-v="1">★</span>
        <span class="star" data-v="2">★</span>
        <span class="star" data-v="3">★</span>
        <span class="star" data-v="4">★</span>
        <span class="star" data-v="5">★</span>
      </div>
    </div>
    <div class="field" style="margin-top:14px;">
      <label for="feedback">Feedback (optional)</label>
      <textarea id="feedback" rows="3" placeholder="What went well? Anything they could improve?"></textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary btn-block" id="modalCancel">Cancel</button>
      <button class="btn btn-primary btn-block" id="modalSubmit">Submit rating</button>
    </div>
  </div>
</div>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  let rating = 0;
  let targetSession = null;

  if (user) {
    renderNavbar('/exchange-requests/index.html');
    load();

    document.querySelectorAll('.star').forEach(star => {
      star.addEventListener('click', () => {
        rating = parseInt(star.dataset.v);
        updateStars();
      });
      star.addEventListener('mouseenter', () => highlightStars(parseInt(star.dataset.v)));
    });
    document.getElementById('starRow').addEventListener('mouseleave', updateStars);
  }

  function highlightStars(v) {
    document.querySelectorAll('.star').forEach(s => s.classList.toggle('active', parseInt(s.dataset.v) <= v));
  }
  function updateStars() { highlightStars(rating); }

  async function load() {
    const sessions = (await db.getSessionsFor(user.id)).filter(s => s.status === 'scheduled' || (s.status === 'completed' && s.fromUserId === user.id));
    const list = document.getElementById('list');
    if (!sessions.length) {
      list.innerHTML = `<div class="empty-state"><div class="empty-state__icon">🗓️</div><p>No sessions to rate yet. Book one from an accepted request.</p></div>`;
      return;
    }
    list.innerHTML = sessions.map(s => {
      const mentor = s.toUser;
      const canRate = s.status === 'scheduled' && s.fromUserId === user.id;
      return `
      <div class="session-item">
        <div>
          <div style="font-weight:700;font-size:14.5px;">${s.skillName} with ${mentor?.name || '—'}</div>
          <div style="font-size:12.5px;color:var(--ink-soft);">${new Date(s.datetime).toLocaleString([], {dateStyle:'medium', timeStyle:'short'})} · ${s.platform}</div>
        </div>
        ${canRate
          ? `<button class="btn btn-primary btn-sm" onclick='openModal(${JSON.stringify({id:s.id, mentor:mentor?.name, skill:s.skillName}).replace(/'/g,"&#39;")})'>Rate now</button>`
          : `<span class="pill pill-emerald">★ ${s.rating || '—'} rated</span>`}
      </div>`;
    }).join('');
  }

  function openModal(s) {
    targetSession = s;
    rating = 0;
    updateStars();
    document.getElementById('modalTitle').textContent = 'Rate ' + s.skill;
    document.getElementById('modalSub').textContent = 'with ' + s.mentor;
    document.getElementById('feedback').value = '';
    document.getElementById('modalOverlay').style.display = 'flex';
  }
  document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('modalOverlay').style.display = 'none');

  document.getElementById('modalSubmit').addEventListener('click', async () => {
    if (!rating) { toast('Please select a star rating.', 'error'); return; }
    const btn = document.getElementById('modalSubmit');
    btn.disabled = true; btn.textContent = 'Submitting…';
    await db.rateSession(targetSession.id, { rating, feedback: document.getElementById('feedback').value.trim() });
    btn.disabled = false; btn.textContent = 'Submit rating';
    document.getElementById('modalOverlay').style.display = 'none';
    toast('Thanks for your feedback!', 'success');
    load();
  });
</script>
</body>
</html>
