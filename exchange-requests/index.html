<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exchange Requests · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .tabs { display:flex; gap:6px; background:var(--bg-soft); padding:5px; border-radius: var(--r-pill); width:fit-content; margin-bottom:22px; border:1px solid var(--border); }
  .tab-btn { border:none; background:transparent; padding:9px 20px; border-radius:var(--r-pill); font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer; display:flex; align-items:center; gap:8px; transition:all .15s ease; }
  .tab-btn.active { background:#fff; color:var(--violet); box-shadow: var(--shadow-soft); }
  .tab-badge { background:#e8e5ff; color:var(--violet); font-size:11px; padding:2px 7px; border-radius:var(--r-pill); font-weight:800; }
  .tab-btn.active .tab-badge { background:var(--violet); color:#fff; }
  .req-card { display:flex; gap:16px; align-items:flex-start; transition: transform .15s ease, box-shadow .15s ease; }
  .req-card + .req-card { margin-top: 14px; }
  .req-card:hover { box-shadow: var(--shadow-lift); }
  .req-actions { display:flex; gap:10px; margin-top:12px; align-items:center; flex-wrap:wrap; }
  .session-box {
    margin-top: 12px;
    background: #f4f8ff;
    border: 1.5px solid #d0e2ff;
    border-radius: var(--r-md);
    padding: 12px 16px;
  }
  .session-box__header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 6px;
  }
  .session-box__title {
    font-weight: 700;
    font-size: 13.5px;
    color: var(--royal-blue);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .session-box__meta {
    font-size: 13px;
    color: var(--ink);
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    margin-top: 4px;
  }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container" style="max-width: 820px;">
    <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:8px;">
      <div>
        <span class="eyebrow">Inbox & Collaborations</span>
        <h1 class="section-title" style="font-size:26px;margin-top:6px;">Exchange Requests</h1>
        <p class="section-sub">Manage your skill swap requests. Once accepted by either side, you can book a 1-on-1 session.</p>
      </div>
      <a href="../book-session/index.html" class="btn btn-secondary btn-sm" style="margin-top:8px;">
        📅 Open Booking Hub
      </a>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="incoming">
        Incoming <span class="tab-badge" id="inBadge">0</span>
      </button>
      <button class="tab-btn" data-tab="outgoing">
        Outgoing <span class="tab-badge" id="outBadge">0</span>
      </button>
    </div>

    <div id="list">
      <div class="card" style="padding:40px;text-align:center;">
        <div class="skeleton" style="height:24px;width:180px;margin:0 auto 12px;"></div>
        <div class="skeleton" style="height:16px;width:300px;margin:0 auto;"></div>
      </div>
    </div>
  </div>
</main>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  let currentTab = 'incoming';
  let data = { incoming: [], outgoing: [] };
  let userSessions = [];
  let tabSwitchedAutomatically = false;

  if (user) {
    renderNavbar('/exchange-requests/index.html');
    load();

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        render();
      });
    });
  }

  async function load() {
    try {
      const [reqData, sessData] = await Promise.all([
        db.getRequestsFor(user.id),
        db.getSessionsFor(user.id)
      ]);
      data = reqData;
      userSessions = sessData || [];

      document.getElementById('inBadge').textContent = data.incoming.length;
      document.getElementById('outBadge').textContent = data.outgoing.length;

      // If incoming is empty but outgoing has items on first load, switch automatically
      if (!tabSwitchedAutomatically && data.incoming.length === 0 && data.outgoing.length > 0) {
        tabSwitchedAutomatically = true;
        currentTab = 'outgoing';
        document.querySelectorAll('.tab-btn').forEach(b => {
          b.classList.toggle('active', b.dataset.tab === 'outgoing');
        });
      }

      render();
    } catch (err) {
      console.error('Error loading requests:', err);
      document.getElementById('list').innerHTML = `
        <div class="empty-state card">
          <div class="empty-state__icon">⚠️</div>
          <p>Unable to load exchange requests right now.</p>
          <button class="btn btn-secondary btn-sm" onclick="load()" style="margin-top:12px;">Retry</button>
        </div>`;
    }
  }

  function statusPill(status) {
    const map = { pending: 'pill-violet', accepted: 'pill-emerald', declined: 'pill-error' };
    return `<span class="pill ${map[status] || 'pill-grey'}">${status}</span>`;
  }

  function render() {
    const list = document.getElementById('list');
    const items = data[currentTab] || [];

    if (!items.length) {
      list.innerHTML = `
        <div class="empty-state card">
          <div class="empty-state__icon">${currentTab === 'incoming' ? '📭' : '📤'}</div>
          <p style="font-weight:600;font-size:15px;color:var(--ink);margin-bottom:4px;">No ${currentTab} requests yet.</p>
          <p style="font-size:13px;color:var(--ink-soft);max-width:380px;margin:0 auto 16px;">
            ${currentTab === 'incoming' 
              ? 'When another student wants to learn your skill, their request will appear here.'
              : 'Find skills from mentors in your college and send them a swap request.'}
          </p>
          <a href="../search-skills/index.html" class="btn btn-primary btn-sm">Find Skills to Swap</a>
        </div>`;
      return;
    }

    list.innerHTML = items.map(r => {
      const other = currentTab === 'incoming' ? r.fromUser : r.toUser;
      const initials = other && other.name ? other.name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase() : '?';
      const roleText = currentTab === 'incoming'
        ? `wants to learn: <b style="color:var(--violet);">${r.skillName}</b>`
        : `you requested to learn: <b style="color:var(--violet);">${r.skillName}</b>`;

      // Check if a session has already been scheduled for this request
      const linkedSession = userSessions.find(s => s.requestId === r.id && s.status !== 'cancelled');

      let actions = '';
      if (r.status === 'pending') {
        if (currentTab === 'incoming') {
          actions = `
          <div class="req-actions">
            <button class="btn btn-emerald btn-sm" onclick="respond('${r.id}','accepted', this)">✓ Accept Swap</button>
            <button class="btn btn-secondary btn-sm" onclick="respond('${r.id}','declined', this)">✕ Decline</button>
          </div>`;
        } else {
          actions = `
          <div class="req-actions">
            <span class="pill pill-violet" style="font-size:12px;">⏳ Awaiting partner's acceptance</span>
          </div>`;
        }
      } else if (r.status === 'accepted') {
        if (linkedSession) {
          const dateStr = new Date(linkedSession.datetime).toLocaleString([], {
            weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'
          });
          actions = `
          <div class="session-box">
            <div class="session-box__header">
              <span class="session-box__title">✅ Session Scheduled</span>
              <span class="pill pill-blue">${linkedSession.status}</span>
            </div>
            <div class="session-box__meta">
              <span>⏰ <b>${dateStr}</b></span>
              <span>📍 <b>${linkedSession.platform}</b></span>
            </div>
            <div class="req-actions" style="margin-top:10px;">
              <a class="btn btn-primary btn-sm" href="../book-session/index.html?requestId=${r.id}">
                📅 View & Manage Booking
              </a>
              <a class="btn btn-secondary btn-sm" href="../rate-session/index.html">
                ⭐ Rate Session
              </a>
            </div>
          </div>`;
        } else {
          // BOTH incoming and outgoing can book a session once accepted!
          actions = `
          <div class="req-actions" style="background:#f6f3ff;border:1px dashed var(--violet);border-radius:var(--r-md);padding:10px 14px;">
            <a class="btn btn-primary btn-sm" href="../book-session/index.html?requestId=${r.id}">
              📅 Book Session Now
            </a>
            <span class="hint" style="margin-top:0;font-weight:600;color:var(--violet);">
              ✓ Accepted! Either partner can pick a date, time & platform.
            </span>
          </div>`;
        }
      } else if (r.status === 'declined') {
        actions = `
        <div class="req-actions">
          <span class="pill pill-error">✕ Request Declined</span>
        </div>`;
      }

      return `
      <div class="card req-card">
        <div class="avatar" style="width:44px;height:44px;font-size:15px;">${initials}</div>
        <div style="flex:1;">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap;">
            <div>
              <div style="font-weight:700;font-size:16px;">${other ? other.name : 'SkillSwap Member'}</div>
              <div style="font-size:13px;color:var(--ink-soft);margin-top:2px;">${roleText}</div>
            </div>
            ${statusPill(r.status)}
          </div>
          ${r.message ? `
            <p style="margin-top:10px;font-size:13.5px;color:var(--ink-soft);background:var(--bg-soft);padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--border);">
              "${r.message}"
            </p>` : ''}
          ${actions}
        </div>
      </div>`;
    }).join('');
  }

  async function respond(id, status, btnEl) {
    if (btnEl) { btnEl.disabled = true; btnEl.textContent = 'Processing…'; }
    try {
      const res = await db.updateRequestStatus(id, status);
      if (res && res.ok) {
        toast(status === 'accepted' ? 'Request accepted! You can now book a session.' : 'Request declined.', status === 'accepted' ? 'success' : 'default');
      } else {
        toast('Action completed!', 'success');
      }
      await load();
    } catch (err) {
      console.error('Error responding to request:', err);
      toast('Failed to update request. Please try again.', 'error');
      if (btnEl) { btnEl.disabled = false; btnEl.textContent = status === 'accepted' ? '✓ Accept Swap' : '✕ Decline'; }
    }
  }
</script>
</body>
</html>
