<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Find Skills · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .search-bar { display:flex; gap:10px; margin-bottom: 18px; }
  .search-bar input { flex:1; }
  .chip-row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:24px; }
  .chip {
    padding: 7px 15px; border-radius: var(--r-pill); font-size:13px; font-weight:600;
    background: #fff; border: 1.5px solid var(--border); cursor:pointer; color: var(--ink-soft);
  }
  .chip.active { background: var(--gradient-primary); color:#fff; border-color: transparent; }
  .result-card { display:flex; flex-direction:column; gap:12px; }
  .result-top { display:flex; align-items:center; gap:12px; }
  .result-meta { font-size:12.5px; color:var(--ink-soft); }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container">
    <span class="eyebrow">Discover</span>
    <h1 class="section-title" style="font-size:26px;margin-top:6px;">Find a skill to learn</h1>
    <p class="section-sub">Search mentors offering the skill you need.</p>

    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search for a skill, e.g. Python, Guitar, UI Design…">
      <button class="btn btn-primary" id="searchBtn">Search</button>
    </div>

    <div class="chip-row" id="categoryChips"></div>

    <div id="resultsMeta" style="margin-bottom:14px;font-size:13.5px;color:var(--ink-soft);"></div>
    <div class="grid grid-3" id="results"></div>
  </div>
</main>

<!-- Request modal -->
<div id="modalOverlay" style="display:none;position:fixed;inset:0;background:rgba(26,26,46,.5);z-index:100;align-items:center;justify-content:center;padding:20px;">
  <div class="card" style="max-width:420px;width:100%;">
    <h3 class="section-title" id="modalTitle">Request skill</h3>
    <p class="section-sub" id="modalSub"></p>
    <div class="field">
      <label for="reqMessage">Message</label>
      <textarea id="reqMessage" rows="4" placeholder="Introduce yourself and say why you'd like to learn this."></textarea>
    </div>
    <div style="display:flex;gap:10px;">
      <button class="btn btn-secondary btn-block" id="modalCancel">Cancel</button>
      <button class="btn btn-primary btn-block" id="modalSend">Send request</button>
    </div>
  </div>
</div>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  const categories = ['All', 'Coding', 'Design', 'Music', 'Art', 'Electronics', 'Soft Skills', 'Academics'];
  let activeCategory = 'All';
  let selectedTarget = null;

  if (user) {
    renderNavbar('/search-skills/index.html');

    document.getElementById('categoryChips').innerHTML = categories.map(c =>
      `<button class="chip ${c==='All'?'active':''}" data-cat="${c}">${c}</button>`).join('');

    document.querySelectorAll('.chip').forEach(chip => {
      chip.addEventListener('click', () => {
        document.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeCategory = chip.dataset.cat;
        runSearch();
      });
    });

    document.getElementById('searchBtn').addEventListener('click', runSearch);
    document.getElementById('searchInput').addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });

    runSearch();
  }

  async function runSearch() {
    const query = document.getElementById('searchInput').value;
    const results = document.getElementById('results');
    results.innerHTML = `<div class="skeleton card" style="height:150px;"></div><div class="skeleton card" style="height:150px;"></div><div class="skeleton card" style="height:150px;"></div>`;

    const found = (await db.searchSkills({ query, category: activeCategory, type: 'offer' })).filter(s => s.userId !== user.id);
    document.getElementById('resultsMeta').textContent = `${found.length} mentor${found.length===1?'':'s'} found`;

    if (!found.length) {
      results.innerHTML = `<div class="empty-state card" style="grid-column:1/-1;"><div class="empty-state__icon">🔍</div><p>No matches yet — try another skill or category.</p></div>`;
      return;
    }

    results.innerHTML = found.map(s => `
      <div class="card result-card hover-lift">
        <div class="result-top">
          <div class="avatar">${s.user.name.split(' ').map(p=>p[0]).join('').slice(0,2)}</div>
          <div>
            <div style="font-weight:700;font-size:15px;">${s.user.name}</div>
            <div class="result-meta">${s.user.dept} · ${s.user.year}</div>
          </div>
        </div>
        <div>
          <span class="pill pill-emerald">${s.category}</span>
          <div style="font-weight:700;font-size:16px;margin-top:8px;">${s.name}</div>
        </div>
        <div style="display:flex;justify-content:space-between;align-items:center;">
          <span class="result-meta">★ ${s.user.mentorScore || 'New'} · ${s.user.sessionsCount} sessions</span>
          <button class="btn btn-primary btn-sm" onclick='openModal(${JSON.stringify({id:s.user.id,name:s.user.name,skill:s.name}).replace(/'/g,"&#39;")})'>Request</button>
        </div>
      </div>`).join('');
  }

  function openModal(target) {
    selectedTarget = target;
    document.getElementById('modalTitle').textContent = 'Request ' + target.skill;
    document.getElementById('modalSub').textContent = 'from ' + target.name;
    document.getElementById('reqMessage').value = '';
    document.getElementById('modalOverlay').style.display = 'flex';
  }
  document.getElementById('modalCancel').addEventListener('click', () => document.getElementById('modalOverlay').style.display = 'none');

  document.getElementById('modalSend').addEventListener('click', async () => {
    if (!selectedTarget) return;
    const btn = document.getElementById('modalSend');
    btn.disabled = true; btn.textContent = 'Sending…';
    await db.sendRequest({
      fromUserId: user.id,
      toUserId: selectedTarget.id,
      skillName: selectedTarget.skill,
      message: document.getElementById('reqMessage').value.trim() || `Hi! I'd love to learn ${selectedTarget.skill}.`
    });
    btn.disabled = false; btn.textContent = 'Send request';
    document.getElementById('modalOverlay').style.display = 'none';
    toast('Request sent to ' + selectedTarget.name + '!', 'success');
  });
</script>
</body>
</html>
