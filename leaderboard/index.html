<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leaderboard · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .podium { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; margin-bottom: 26px; align-items:end; }
  .podium-card { text-align:center; padding: 20px 14px; border-radius: var(--r-lg); position:relative; }
  .podium-card .avatar { margin: 0 auto 10px; width:56px;height:56px;font-size:18px; }
  .podium-card .rank { position:absolute; top:-12px; left:50%; transform:translateX(-50%); width:28px;height:28px;border-radius:50%;
    display:flex;align-items:center;justify-content:center; font-weight:800; font-size:13px; color:#fff; }
  .p1 { background: linear-gradient(160deg,#fff7e0,#ffe8a3); order:2; padding-top:30px; }
  .p1 .rank { background: linear-gradient(135deg,#ffd35c,#ffb100); }
  .p2 { background: #fff; order:1; }
  .p2 .rank { background: #b0b7c3; }
  .p3 { background: #fff; order:3; }
  .p3 .rank { background: #d69a63; }
  @media (max-width: 640px) { .podium { grid-template-columns:1fr; } .p1,.p2,.p3 { order:0; } }
  .lb-row { display:grid; grid-template-columns: 40px 1fr auto auto; gap:14px; align-items:center; padding:14px 0; border-bottom:1px solid var(--border); }
  .lb-row:last-child { border-bottom:none; }
  .lb-row.me { background: #f6f1ff; margin: 0 -18px; padding: 14px 18px; border-radius: var(--r-md); }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container" style="max-width: 780px;">
    <span class="eyebrow">Gamification</span>
    <h1 class="section-title" style="font-size:26px;margin-top:6px;">Leaderboard</h1>
    <p class="section-sub">Top mentors ranked by average rating across all sessions.</p>

    <div class="podium" id="podium"></div>

    <div class="card">
      <div id="lbList"></div>
    </div>
  </div>
</main>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  if (user) {
    renderNavbar('/leaderboard/index.html');
    load();
  }

  function initials(name) { return name.split(' ').map(p=>p[0]).join('').slice(0,2).toUpperCase(); }

  async function load() {
    const ranked = await db.getLeaderboard();
    const top3 = ranked.slice(0, 3);
    const order = [top3[1], top3[0], top3[2]]; // 2nd, 1st, 3rd for podium visual
    const classes = ['p2', 'p1', 'p3'];

    document.getElementById('podium').innerHTML = order.map((u, i) => u ? `
      <div class="podium-card ${classes[i]}">
        <div class="rank">${i===1?1:i===0?2:3}</div>
        <div class="avatar">${initials(u.name)}</div>
        <div style="font-weight:700;font-size:14.5px;">${u.name}</div>
        <div style="font-size:12.5px;color:var(--ink-soft);margin-top:2px;">★ ${u.mentorScore || 'New'} · ${u.sessionsCount} sessions</div>
        ${u.badges?.[0] ? `<div class="badge" style="margin-top:8px;"><span class="badge__icon">🏅</span>${u.badges[0]}</div>` : ''}
      </div>` : '').join('');

    document.getElementById('lbList').innerHTML = ranked.map((u, i) => `
      <div class="lb-row ${u.id === user.id ? 'me' : ''}">
        <div style="font-weight:800;color:var(--ink-faint);">#${i+1}</div>
        <div style="display:flex;align-items:center;gap:10px;">
          <div class="avatar" style="width:34px;height:34px;font-size:12px;">${initials(u.name)}</div>
          <div>
            <div style="font-weight:700;font-size:14px;">${u.name} ${u.id===user.id ? '<span class="pill pill-violet" style="margin-left:6px;">You</span>' : ''}</div>
            <div style="font-size:12px;color:var(--ink-soft);">${u.dept}</div>
          </div>
        </div>
        <div style="font-size:13px;color:var(--ink-soft);">${u.sessionsCount} sessions</div>
        <div style="font-weight:800;color:#ffb100;">★ ${u.mentorScore || '—'}</div>
      </div>`).join('');
  }
</script>
</body>
</html>
