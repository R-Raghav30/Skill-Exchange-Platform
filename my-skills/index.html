<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Skills · SkillSwap</title>
<link rel="stylesheet" href="../shared/shared.css">
<style>
  .tabs { display:flex; gap:6px; background:var(--bg-soft); padding:5px; border-radius: var(--r-pill); width:fit-content; margin-bottom:22px; }
  .tab-btn { border:none; background:transparent; padding:9px 20px; border-radius:var(--r-pill); font-weight:700; font-size:13.5px; color:var(--ink-soft); cursor:pointer; }
  .tab-btn.active { background:#fff; color:var(--violet); box-shadow: var(--shadow-soft); }
  .skill-card { display:flex; align-items:center; justify-content:space-between; padding:16px 18px; }
  .skill-card + .skill-card { margin-top: 10px; }
  .add-form { display:flex; gap:10px; align-items: flex-end; }
  .add-form .field { flex:1; margin-bottom:0; }
  @media (max-width: 640px) { .add-form { flex-direction: column; align-items: stretch; } }
</style>
</head>
<body class="page">

<main style="padding: 28px 0 60px;">
  <div class="container" style="max-width: 820px;">
    <span class="eyebrow">Manage</span>
    <h1 class="section-title" style="font-size:26px;margin-top:6px;">My Skills</h1>
    <p class="section-sub">Add what you can teach, and what you'd love to learn.</p>

    <div class="card" style="margin-bottom:24px;">
      <form class="add-form" id="addForm" novalidate>
        <div class="field">
          <label for="skillName">Skill name</label>
          <input type="text" id="skillName" placeholder="e.g. Photoshop, Spanish, Calculus">
          <p class="error-message" id="err-skillName">⚠ Enter a skill name.</p>
        </div>
        <div class="field" style="max-width:180px;">
          <label for="category">Category</label>
          <select id="category">
            <option>Coding</option><option>Design</option><option>Music</option>
            <option>Art</option><option>Electronics</option><option>Soft Skills</option>
            <option>Academics</option><option>Other</option>
          </select>
        </div>
        <div class="field" style="max-width:170px;">
          <label for="type">I want to…</label>
          <select id="type">
            <option value="offer">Teach it</option>
            <option value="request">Learn it</option>
          </select>
        </div>
        <button type="submit" class="btn btn-primary" style="height:46px;">Add skill</button>
      </form>
    </div>

    <div class="tabs">
      <button class="tab-btn active" data-tab="offer">I can teach</button>
      <button class="tab-btn" data-tab="request">I want to learn</button>
    </div>

    <div id="list"></div>
  </div>
</main>

<script src="../shared/app.js"></script>
<script>
  const user = requireAuthOrRedirect();
  let currentTab = 'offer';
  let allSkills = [];

  if (user) {
    renderNavbar('/my-skills/index.html');
    load();

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTab = btn.dataset.tab;
        renderList();
      });
    });

    document.getElementById('addForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const nameEl = document.getElementById('skillName');
      const name = nameEl.value.trim();
      if (!name) {
        nameEl.classList.add('invalid');
        document.getElementById('err-skillName').classList.add('show');
        return;
      }
      nameEl.classList.remove('invalid');
      document.getElementById('err-skillName').classList.remove('show');

      const category = document.getElementById('category').value;
      const type = document.getElementById('type').value;
      await db.addSkill({ userId: user.id, name, category, type });
      nameEl.value = '';
      toast('Skill added!', 'success');
      load();
    });
  }

  async function load() {
    allSkills = await db.getMySkills(user.id);
    renderList();
  }

  function renderList() {
    const list = document.getElementById('list');
    const filtered = allSkills.filter(s => s.type === currentTab);
    if (!filtered.length) {
      list.innerHTML = `<div class="empty-state card"><div class="empty-state__icon">${currentTab === 'offer' ? '🎓' : '🌱'}</div><p>${currentTab === 'offer' ? "You haven't added skills to teach yet." : "You haven't added skills to learn yet."}</p></div>`;
      return;
    }
    list.innerHTML = filtered.map(s => `
      <div class="card skill-card">
        <div style="display:flex;align-items:center;gap:14px;">
          <span class="pill ${currentTab === 'offer' ? 'pill-emerald' : 'pill-violet'}">${s.category}</span>
          <div style="font-weight:700;font-size:15px;">${s.name}</div>
        </div>
        <button class="btn btn-ghost btn-sm" onclick="removeSkill('${s.id}')">Remove</button>
      </div>`).join('');
  }

  async function removeSkill(id) {
    await db.deleteSkill(id);
    toast('Skill removed.');
    load();
  }
</script>
</body>
</html>
